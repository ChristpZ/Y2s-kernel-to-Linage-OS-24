name: Build SukiSU Kernel for y2s - Self-Diagnosing

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev ccache python3 \
            clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu

      - name: Pre-flight diagnostics
        run: |
          echo "=== PATH ==="
          echo $PATH
          echo ""
          echo "=== Which clang? ==="
          which clang-14 || echo "clang-14 NO encontrado"
          which clang || echo "clang NO encontrado"
          echo ""
          echo "=== Which ld.lld? ==="
          which ld.lld-14 || echo "ld.lld-14 NO encontrado"
          echo ""
          echo "=== Which objcopy? ==="
          which llvm-objcopy-14 || echo "llvm-objcopy-14 NO encontrado"
          which aarch64-linux-gnu-objcopy || echo "aarch64-linux-gnu-objcopy NO encontrado"
          which objcopy || echo "objcopy NO encontrado"
          echo ""
          echo "=== Versions ==="
          clang-14 --version 2>/dev/null | head -1 || true
          ld.lld-14 --version 2>/dev/null | head -1 || true
          llvm-objcopy-14 --version 2>/dev/null | head -1 || true
          aarch64-linux-gnu-objcopy --version 2>/dev/null | head -1 || true
          objcopy --version 2>/dev/null | head -1 || true

      - name: Clone Kernel Source (LineageOS 24.0)
        run: |
          git clone --depth=1 -b lineage-24.0 \
            https://github.com/LineageOS/android_kernel_samsung_universal9830 kernel

      - name: Inject SukiSU (builtin)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          if [ -d "drivers/kernelsu" ]; then
            echo "✅ SukiSU inyectado en drivers/kernelsu"
          else
            echo "❌ SukiSU NO inyectado"
            exit 1
          fi

      - name: Configure Kernel
        run: |
          cd kernel
          export PATH=/usr/lib/llvm-14/bin:$PATH
          make ARCH=arm64 \
            CC=clang-14 \
            LD=ld.lld-14 \
            AR=llvm-ar-14 \
            NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 \
            OBJDUMP=llvm-objdump-14 \
            STRIP=llvm-strip-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            exynos9830_defconfig
          ./scripts/kconfig/merge_config.sh -m -r .config arch/arm64/configs/y2s.config
          scripts/config --file .config --enable CONFIG_KSU
          scripts/config --file .config --enable CONFIG_KALLSYMS
          scripts/config --file .config --enable CONFIG_KALLSYMS_ALL
          make ARCH=arm64 \
            CC=clang-14 \
            LD=ld.lld-14 \
            AR=llvm-ar-14 \
            NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 \
            OBJDUMP=llvm-objdump-14 \
            STRIP=llvm-strip-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig
          echo "=== Config final ==="
          grep -E "CONFIG_KSU|CONFIG_KALLSYMS" .config

      - name: Build Kernel
        id: build
        run: |
          cd kernel
          export PATH=/usr/lib/llvm-14/bin:$PATH
          make ARCH=arm64 \
            CC=clang-14 \
            LD=ld.lld-14 \
            AR=llvm-ar-14 \
            NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 \
            OBJDUMP=llvm-objdump-14 \
            STRIP=llvm-strip-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j$(nproc)

      - name: ✅ Build succeeded - verify artifact
        if: success()
        run: |
          cd kernel
          if [ -f arch/arm64/boot/Image ]; then
            echo "✅ Image generado: $(ls -lh arch/arm64/boot/Image)"
            strings arch/arm64/boot/Image | grep -qi "ksu" && echo "✅ KernelSU presente" || echo "⚠️ KernelSU NO detectado en Image"
          else
            echo "❌ Image NO generado"
            exit 1
          fi

      - name: ❌ POST-MORTEM - diagnosing failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          cd kernel
          echo "=========================================="
          echo "  POST-MORTEM: por qué falló la compilación"
          echo "=========================================="
          echo ""
          echo "--- 1. ¿Qué objcopy se usó realmente? ---"
          grep -r "OBJCOPY" arch/arm64/kernel/vdso/Makefile 2>/dev/null | head -5
          echo ""
          echo "--- 2. Últimas 30 líneas del log de make ---"
          # Buscamos el log de make si existe
          if [ -f .make.log ]; then
            tail -30 .make.log
          else
            echo "(no hay .make.log, revisa el paso 'Build Kernel' arriba)"
          fi
          echo ""
          echo "--- 3. ¿Existe vdso.so.dbg? ---"
          ls -la arch/arm64/kernel/vdso/vdso.so.dbg 2>/dev/null || echo "No existe vdso.so.dbg"
          if [ -f arch/arm64/kernel/vdso/vdso.so.dbg ]; then
            file arch/arm64/kernel/vdso/vdso.so.dbg
          fi
          echo ""
          echo "--- 4. ¿Qué CROSS_COMPILE se usó? ---"
          grep "CROSS_COMPILE" .config | head -3 || echo "No definido en .config"
          echo ""
          echo "--- 5. Sugerencia de corrección ---"
          echo "Si el error es 'objcopy: Unable to recognise the format':"
          echo "  -> El Makefile está usando aarch64-linux-gnu-objcopy (GNU) en vez de llvm-objcopy-14"
          echo "  -> Solución: añadir OBJCOPY=llvm-objcopy-14 directamente en la línea de make (ya está en este script)"
          echo "  -> Si aún así falla, probar con CROSS_COMPILE vacío y dejar solo CC=clang-14"
          echo ""
          echo "Si el error es 'inlining failed' o 'function body not available':"
          echo "  -> Clang 14 es demasiado estricto con 'always_inline' en código de 4.19"
          echo "  -> Solución: añadir KCFLAGS='-Wno-error' o usar GCC en vez de Clang"
          echo ""
          echo "Si el error es 'variable argument lists' en bpf_trace.c:"
          echo "  -> Clang no permite 'static inline' con va_list"
          echo "  -> Solución: quitar 'inline' de bpf_do_trace_printk en kernel/trace/bpf_trace.c"
          echo ""
          echo "=========================================="
          echo "  FIN DEL POST-MORTEM"
          echo "=========================================="
          exit 1

      - name: Upload Artifact (Image + config)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Kernel-Image-y2s
          path: |
            kernel/arch/arm64/boot/Image
            kernel/.config
