name: Build SukiSU Kernel for y2s (Exynos 990) - GCC + PATCHES

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev ccache python3 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Clone Kernel Source (LineageOS 24.0)
        run: |
          git clone --depth=1 -b lineage-24.0 \
            https://github.com/LineageOS/android_kernel_samsung_universal9830 kernel

      - name: Apply Critical GCC Patches
        run: |
          cd kernel
          echo " Aplicando parche 1: Fix 'always_inline' en page_alloc.c..."
          # Reemplaza 'extern inline bool need_memory_boosting' por 'static inline bool need_memory_boosting' 
          # o simplemente quita 'extern inline' si la definición está en otro lado.
          # En este caso, lo más seguro es convertirlo en una función normal no-inline si falla.
          sed -i 's/extern inline bool need_memory_boosting/static inline bool need_memory_boosting/g' mm/page_alloc.c
          
          echo "🔧 Aplicando parche 2: Fix 'inline va_list' en bpf_trace.c..."
          # Quita la palabra 'inline' de la función bpf_do_trace_printk
          sed -i 's/static inline __printf(1, 0) int bpf_do_trace_printk/static __printf(1, 0) int bpf_do_trace_printk/g' kernel/trace/bpf_trace.c
          
          echo "✅ Parches aplicados."

      - name: Inject SukiSU (Builtin Mode)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          if [ -d "drivers/kernelsu" ]; then
            echo "✅ SukiSU inyectado correctamente"
          else
            echo " Error al inyectar SukiSU"
            exit 1
          fi

      - name: Configure Kernel (GCC)
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make exynos9830_defconfig
          ./scripts/kconfig/merge_config.sh -m -r .config arch/arm64/configs/y2s.config
          
          scripts/config --file .config --enable CONFIG_KSU
          scripts/config --file .config --enable CONFIG_KALLSYMS
          scripts/config --file .config --enable CONFIG_KALLSYMS_ALL
          
          make olddefconfig

      - name: Build Kernel (GCC)
        id: build_step
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS="-Wno-error" # Ignorar warnings que no son errores críticos
          
          make -j$(nproc)

      - name: ✅ Build Succeeded - Verify Artifact
        if: success()
        run: |
          cd kernel
          if [ -f arch/arm64/boot/Image ]; then
            SIZE=$(ls -lh arch/arm64/boot/Image | awk '{print $5}')
            echo "✅ Image generado exitosamente: $SIZE"
            
            if strings arch/arm64/boot/Image | grep -qi "ksu"; then
              echo "✅ VERIFICADO: KernelSU/SukiSU está integrado."
            else
              echo "⚠️ ADVERTENCIA: No se detectó 'ksu', revisa manualmente."
            fi
          else
            echo "❌ ERROR: El archivo Image no se generó."
            exit 1
          fi

      - name: 🚨 DIAGNÓSTICO DE FALLO (Auto-Analysis)
        if: failure() && steps.build_step.outcome == 'failure'
        run: |
          cd kernel
          echo "=========================================="
          echo "  🚨 EL WORKFLOW HA FALLADO - ANÁLISIS"
          echo "=========================================="
          echo ""
          echo "1. Buscando el último error de compilación..."
          echo "Revisa el paso anterior 'Build Kernel (GCC)' para ver el error rojo exacto."
          echo ""
          echo "2. Verificando archivos críticos..."
          if [ ! -f ".config" ]; then
             echo "❌ PROBLEMA: Falta el archivo .config."
          else
             echo "✅ El archivo .config existe."
          fi
          
          echo ""
          echo "3. Posibles causas restantes:"
          echo "   - Si sigue fallando en 'inlining': El parche sed no funcionó como esperaba."
          echo "   - Si el error es 'Killed': Se acabó la memoria RAM del runner."
          echo "   - Si hay errores de 'undefined reference': Faltan dependencias o configs."
          echo ""
          echo "4. Recomendación:"
          echo "   Copia las últimas 20 líneas rojas del paso 'Build Kernel (GCC)' y pégalas aquí."
          echo "=========================================="
          exit 1

      - name: Upload Artifact (Image + config)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Kernel-Image-y2s-GCC-Patched
          path: |
            kernel/arch/arm64/boot/Image
            kernel/.config
