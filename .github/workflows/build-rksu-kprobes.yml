name: Build Rksu (KernelSU) kprobes Kernel for y2s (Exynos 990)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev ccache python3 \
            gcc-aarch64-linux-gnu

      - name: Clone Kernel Source (LineageOS 24.0)
        run: |
          git clone --depth=1 -b lineage-24.0 \
            https://github.com/LineageOS/android_kernel_samsung_universal9830 kernel

      - name: Install modern Clang/LLD (LLVM 17)
        run: |
          set -euo pipefail
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get install -y llvm-17
          echo "/usr/lib/llvm-17/bin" >> "$GITHUB_PATH"

      - name: Inject KernelSU (Rksu, non-GKI)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Configure Kernel (kprobes hooks, no manual hooks)
        run: |
          cd kernel
          M="make ARCH=arm64 CC=clang-17 LD=ld.lld-17 NM=llvm-nm-17 OBJCOPY=llvm-objcopy-17 STRIP=llvm-strip-17 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-"
          $M exynos9830_defconfig
          ./scripts/kconfig/merge_config.sh -m -r .config arch/arm64/configs/y2s.config
          scripts/config --file .config --enable CONFIG_KSU
          scripts/config --file .config --disable CONFIG_KSU_MANUAL_HOOK
          scripts/config --file .config --enable CONFIG_KPROBES
          scripts/config --file .config --enable CONFIG_KPROBE_EVENTS
          scripts/config --file .config --enable CONFIG_KALLSYMS
          scripts/config --file .config --enable CONFIG_KALLSYMS_ALL
          $M olddefconfig
          echo "--- config final ---"
          grep -E "CONFIG_(KSU|KPROBES|KPROBE_EVENTS|KALLSYMS|KALLSYMS_ALL)[_A-Z]*[= ]" .config || true
          # olddefconfig apaga en silencio lo que no cumple dependencias: se comprueba
          grep -q "^CONFIG_KPROBES=y" .config || { echo "KPROBES no quedo activado"; exit 1; }
          grep -q "^CONFIG_KSU=y" .config || { echo "KSU no quedo activado"; exit 1; }

      - name: Build Kernel
        run: |
          set -o pipefail
          cd kernel
          make -k ARCH=arm64 CC=clang-17 LD=ld.lld-17 NM=llvm-nm-17 OBJCOPY=llvm-objcopy-17 STRIP=llvm-strip-17 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- -j$(nproc) 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: |
          cd kernel
          echo "===== TODOS LOS ERRORES ====="
          grep -nE "error:|undefined reference|Error [0-9]+" build.log | head -80 || true

      - name: Verify KernelSU is built in
        run: |
          cd kernel
          strings arch/arm64/boot/Image | grep -m1 "Linux version"
          strings arch/arm64/boot/Image | grep -qi "ksu" || { echo "KernelSU no aparece en el Image"; exit 1; }
          echo "OK: KernelSU esta dentro del Image"

      - name: Upload Artifact (Image + config)
        uses: actions/upload-artifact@v4
        with:
          name: Rksu-kprobes-Image-y2s
          path: |
            kernel/arch/arm64/boot/Image
            kernel/.config
