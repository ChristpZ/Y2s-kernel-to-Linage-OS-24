name: Build SukiSU Kernel for y2s

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev ccache python3 clang-14 lld-14

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b lineage-24.0 \
            https://github.com/LineageOS/android_kernel_samsung_universal9830 kernel

      - name: Inspect repo structure
        run: |
          cd kernel
          echo "=== Archivos en raíz ==="
          ls -la | head -30
          echo "=== build.config.universal9830 ==="
          cat build.config.universal9830 2>/dev/null | head -40 || echo "no existe"
          echo "=== toolchain/ ==="
          ls -la toolchain/ 2>/dev/null || echo "no existe toolchain/"
          echo "=== arch/arm64/configs/ ==="
          ls arch/arm64/configs/ | grep -E "y2s|exynos" || echo "no encontrado"

      - name: Inject SukiSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s builtin

      - name: Configure Kernel
        run: |
          cd kernel
          export PATH=/usr/lib/llvm-14/bin:$PATH
          export CC=clang
          export LD=ld.lld
          make ARCH=arm64 CC=clang LD=ld.lld exynos9830_defconfig
          ./scripts/kconfig/merge_config.sh -m -r .config arch/arm64/configs/y2s.config
          scripts/config --file .config --enable CONFIG_KSU
          scripts/config --file .config --enable CONFIG_KALLSYMS
          scripts/config --file .config --enable CONFIG_KALLSYMS_ALL
          make ARCH=arm64 CC=clang LD=ld.lld olddefconfig

      - name: Build Kernel
        run: |
          cd kernel
          export PATH=/usr/lib/llvm-14/bin:$PATH
          make ARCH=arm64 CC=clang LD=ld.lld -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Kernel-y2s
          path: kernel/arch/arm64/boot/Image
