name: Build SukiSU Kernel for y2s

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev ccache python3

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b lineage-24.0 \
            https://github.com/LineageOS/android_kernel_samsung_universal9830 kernel

      - name: Inject SukiSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s builtin

      - name: Build Kernel (using build.sh)
        run: |
          cd kernel
          chmod +x build.sh
          ./build.sh -m g985f

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Kernel-y2s
          path: kernel/out_g985f/arch/arm64/boot/Image
