name: Build SukiSU Kernel for y2s (Exynos 990)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev ccache python3 \
            gcc-aarch64-linux-gnu

      - name: Clone Kernel Source (LineageOS 24.0)
        run: |
          git clone --depth=1 -b lineage-24.0 \
            https://github.com/LineageOS/android_kernel_samsung_universal9830 kernel

      - name: Install modern Clang/LLD (LLVM 17)
        run: |
          set -euo pipefail
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get install -y llvm-17
          echo "/usr/lib/llvm-17/bin" >> "$GITHUB_PATH"
          /usr/lib/llvm-17/bin/clang --version
          /usr/lib/llvm-17/bin/llvm-nm --version | head -2
          /usr/lib/llvm-17/bin/llvm-ar --version | head -2

      - name: Inject KernelSU (Rksu, non-GKI)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Configure Kernel
        run: |
          cd kernel
          make ARCH=arm64 CC=clang-17 LD=ld.lld-17 NM=llvm-nm-17 OBJCOPY=llvm-objcopy-17 STRIP=llvm-strip-17 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- exynos9830_defconfig
          ./scripts/kconfig/merge_config.sh -m -r .config arch/arm64/configs/y2s.config
          scripts/config --file .config --enable CONFIG_KSU
          scripts/config --file .config --enable CONFIG_KSU_MANUAL_HOOK
          scripts/config --file .config --enable CONFIG_KALLSYMS
          scripts/config --file .config --enable CONFIG_KALLSYMS_ALL
          make ARCH=arm64 CC=clang-17 LD=ld.lld-17 NM=llvm-nm-17 OBJCOPY=llvm-objcopy-17 STRIP=llvm-strip-17 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

      - name: Build Kernel
        run: |
          cd kernel
          make ARCH=arm64 CC=clang-17 LD=ld.lld-17 NM=llvm-nm-17 OBJCOPY=llvm-objcopy-17 STRIP=llvm-strip-17 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- -j$(nproc)

      - name: Upload Artifact (Image)
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Kernel-Image-y2s
          path: kernel/arch/arm64/boot/Image
