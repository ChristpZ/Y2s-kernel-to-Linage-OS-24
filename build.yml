name: Build SukiSU Kernel for y2s (Exynos 990)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev ccache python3 \
            gcc-aarch64-linux-gnu

      - name: Clone Kernel Source (LineageOS 24.0)
        run: |
          git clone --depth=1 -b lineage-24.0 \
            https://github.com/LineageOS/android_kernel_samsung_universal9830 kernel

      - name: Download Correct Clang (r353983c)
        run: |
          set -euo pipefail
          mkdir -p kernel/clang-toolchain/clang-r353983c
          cd kernel/clang-toolchain/clang-r353983c
          # Commit de AOSP que introdujo clang-r353983c (clang 9.0.3).
          # El +archive de googlesource usa el formato <ref>/<ruta>.tar.gz
          COMMIT=d2358da67980413355f959a206f87442c7e99bcb
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${COMMIT}/clang-r353983c.tar.gz"
          curl -fL --retry 3 -o clang.tar.gz "$URL"
          ls -l clang.tar.gz
          file clang.tar.gz | grep -q "gzip compressed" || { echo "Descarga invalida"; head -c 500 clang.tar.gz; exit 1; }
          tar xzf clang.tar.gz
          rm clang.tar.gz
          echo "CLANG_PATH=$(pwd)" >> "$GITHUB_ENV"
          ./bin/clang --version

      - name: Inject SukiSU (Builtin Mode)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      - name: Configure Kernel
        run: |
          cd kernel
          export PATH=${{ env.CLANG_PATH }}/bin:$PATH
          make ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- exynos9830_defconfig
          ./scripts/kconfig/merge_config.sh -m -r .config arch/arm64/configs/y2s.config
          scripts/config --file .config --enable CONFIG_KSU
          scripts/config --file .config --enable CONFIG_KALLSYMS
          scripts/config --file .config --enable CONFIG_KALLSYMS_ALL
          make ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

      - name: Build Kernel
        run: |
          cd kernel
          export PATH=${{ env.CLANG_PATH }}/bin:$PATH
          make ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- -j$(nproc)

      - name: Upload Artifact (Image)
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Kernel-Image-y2s
          path: kernel/arch/arm64/boot/Image
